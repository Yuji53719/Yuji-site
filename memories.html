<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>記憶 · 甲魚</title><style>
  :root{color-scheme:light dark;--bg:#fbfcff;--surface:#fff;--ink:#14294a;--muted:#5e6f87;--line:#dbe4f0;--blue:#245fa8;--accent:#3d7ed0;--red:#bd3446;--shadow:0 14px 36px rgb(25 71 132 / .10)}@media(prefers-color-scheme:dark){:root{--bg:#1b2028;--surface:#242b35;--ink:#eff5ff;--muted:#b1bfd1;--line:#3b4655;--blue:#85b9f6;--accent:#a9cdfb;--red:#ff8d98;--shadow:0 14px 36px rgb(0 0 0 / .25)}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:PMingLiU,"新細明體","MingLiU",serif}.wrap{width:min(1060px,calc(100% - 40px));margin:auto}header{padding:28px 0 60px;border-bottom:1px solid var(--line)}nav{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:15px;letter-spacing:.08em}a{color:var(--blue);font-weight:bold;text-decoration:none;border-bottom:1px solid currentColor}h1{margin:80px 0 0;font-size:clamp(70px,13vw,145px);letter-spacing:-.1em;line-height:.8}.subtitle{margin:26px 0 0;color:var(--muted);font-size:20px}.extract{display:none;border:0;border-radius:999px;background:var(--blue);color:#fff;padding:10px 16px;font:inherit;font-weight:bold;cursor:pointer}.extract.is-admin{display:inline-block}.memory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:46px 0 60px}.memory-card{position:relative;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;animation:reveal .42s ease both}.memory-card>img{display:block;width:100%;aspect-ratio:4 / 3;object-fit:cover;background:var(--pale)}.memory-info{padding:13px 15px}.memory-date{margin:0;color:var(--muted);font-size:13px}.memory-note{margin:7px 0 0;font-size:16px;line-height:1.45}.memory-count{display:block;margin-top:8px;color:var(--blue);font-size:13px}.delete-memory{position:absolute;right:8px;top:8px;border:0;border-radius:999px;background:rgb(255 255 255 / .88);color:var(--red);padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}.empty{display:grid;place-items:center;min-height:46vh;text-align:center}.empty p{font-size:22px;color:var(--muted)}.editor-modal,.detail-modal{width:min(740px,calc(100% - 30px));border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:24px;box-shadow:var(--shadow)}.editor-modal::backdrop,.detail-modal::backdrop{background:rgb(8 18 38 / .45)}.memory-form{display:grid;gap:14px}.memory-form h2{margin:0;font-size:31px}.memory-form label{display:grid;gap:7px;font-weight:bold}.memory-form input,.memory-form textarea{border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);padding:11px;font:inherit}.memory-form textarea{min-height:105px;resize:vertical}.memory-form button{justify-self:start;border:0;border-radius:12px;background:var(--blue);color:#fff;padding:12px 19px;font:inherit;font-weight:bold;cursor:pointer}.selected-files{margin:0;color:var(--muted);line-height:1.5}.gallery{position:relative}.gallery img{display:block;width:100%;max-height:65vh;object-fit:contain;background:var(--pale);border-radius:14px}.gallery button{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;width:40px;height:40px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-size:25px;cursor:pointer}.gallery .previous{left:10px}.gallery .next{right:10px}.detail-close{display:block;margin:0 0 14px auto;border:0;background:transparent;color:var(--muted);font:inherit;cursor:pointer}.detail-index{text-align:center;color:var(--muted);font-size:14px}.detail-date{margin:20px 0 5px;color:var(--muted);font-size:14px}.detail-note{margin:0;font-size:20px;line-height:1.5}.detail-story{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line);line-height:1.65;white-space:pre-wrap}@keyframes reveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@media(max-width:560px){.wrap{width:min(100% - 28px,1060px)}header{padding-bottom:50px}.memory-grid{gap:12px;padding-top:32px}.subtitle{font-size:18px}.editor-modal,.detail-modal{padding:18px}.gallery img{max-height:56vh}}
</style></head><body><header class="wrap"><nav><a href="./index.html">← 首頁</a><div><a href="./thoughts.html">隨想</a>&nbsp;&nbsp;<button class="extract" id="extract-memory" type="button">抽離</button>&nbsp;&nbsp;<button class="admin-trigger" data-admin-login type="button">管理登入</button></div></nav><h1>記憶</h1><p class="subtitle">留住那些還沒消散的光。</p></header><main class="wrap"><div class="memory-grid" id="memory-grid"></div><section class="empty" id="memory-empty"><div><p>還沒有值得收藏的記憶。</p></div></section></main><dialog class="editor-modal" id="memory-editor"><form class="memory-form" id="memory-form"><h2>抽離記憶</h2><p class="selected-files" id="selected-files"></p><label>備註<input id="memory-note" required placeholder="寫下一句備註……"></label><label>記憶日期<input id="memory-date" required type="date"></label><label>舊聞（可留空）<textarea id="memory-story" placeholder="想說的故事（可留空）"></textarea></label><p class="selected-files" id="memory-message"></p><button type="submit">保存</button></form></dialog><input id="memory-files" type="file" accept="image/*" multiple hidden><dialog class="detail-modal" id="detail-modal"><button class="detail-close" id="detail-close" type="button">關閉 ×</button><div class="gallery"><img id="detail-image" alt="記憶照片"><button class="previous" id="previous-image" type="button" aria-label="上一張">‹</button><button class="next" id="next-image" type="button" aria-label="下一張">›</button></div><p class="detail-index" id="detail-index"></p><p class="detail-date" id="detail-date"></p><p class="detail-note" id="detail-note"></p><p class="detail-story" id="detail-story" hidden></p></dialog><footer class="wrap">© 甲魚 · 記憶沒有好壞之分，我們把它們放在桌子上端詳</footer><script type="module" src="./js/memories.js"></script></body></html>
