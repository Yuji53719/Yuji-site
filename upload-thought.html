<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投稿隨想 · 甲魚</title><style>:root{color-scheme:light dark;--bg:#fbfcff;--surface:#fff;--ink:#14294a;--muted:#5e6f87;--line:#dbe4f0;--blue:#245fa8;--shadow:0 14px 36px rgb(25 71 132 / .10)}@media(prefers-color-scheme:dark){:root{--bg:#1b2028;--surface:#242b35;--ink:#eff5ff;--muted:#b1bfd1;--line:#3b4655;--blue:#85b9f6;--shadow:0 14px 36px rgb(0 0 0 / .25)}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:PMingLiU,"新細明體",serif}.wrap{width:min(760px,calc(100% - 40px));margin:auto}header{padding:28px 0 54px;border-bottom:1px solid var(--line)}a{color:var(--blue);font-weight:bold}h1{margin:74px 0 0;font-size:clamp(58px,11vw,110px);line-height:.8;letter-spacing:-.09em}.subtitle{color:var(--muted);font-size:20px;margin-top:25px}.editor{display:grid;gap:15px;padding:45px 0}.editor label{display:grid;gap:8px;font-size:15px;font-weight:bold}.editor input{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:14px;font:inherit;font-size:18px}.body-panel{padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}.editor button{justify-self:start;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:13px 22px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:var(--shadow)}.message{min-height:1.4em;color:var(--muted)}@media(max-width:560px){.wrap{width:min(100% - 28px,760px)}.body-panel{padding:13px}}</style></head><body><header class="wrap"><a href="./thoughts.html">← 隨想</a><h1>意識延伸</h1><p class="subtitle">我們敲打鍵盤，身體不由自主的輕巧起來</p></header><main class="wrap"><form class="editor" id="thought-form"><label>標題（可留空）<input id="thought-title" maxlength="120"></label><div class="body-panel"><div id="thought-editor"></div></div><p class="message" id="thought-message"></p><button type="submit">發布</button></form></main><script type="module" src="./js/upload-thought.js"></script></body></html>
