<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火熱連載中🔥 · 甲魚</title><style>:root{color-scheme:light dark;--bg:#fbfcff;--surface:#fff;--ink:#14294a;--muted:#5e6f87;--line:#dbe4f0;--blue:#245fa8;--red:#bd3446;--shadow:0 14px 36px rgb(25 71 132 / .10)}@media(prefers-color-scheme:dark){:root{--bg:#1b2028;--surface:#242b35;--ink:#eff5ff;--muted:#b1bfd1;--line:#3b4655;--blue:#85b9f6;--red:#ff8d98;--shadow:0 14px 36px rgb(0 0 0 / .25)}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:PMingLiU,"新細明體","MingLiU",serif}.wrap{width:min(1060px,calc(100% - 40px));margin:auto}header{padding:28px 0 62px;border-bottom:1px solid var(--line)}nav{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:15px;letter-spacing:.08em}a{color:var(--blue);font-weight:bold;text-decoration:none;border-bottom:1px solid currentColor}h1{margin:80px 0 0;font-size:clamp(60px,12vw,140px);line-height:.8;letter-spacing:-.1em}.subtitle{margin:26px 0 0;color:var(--muted);font-size:20px}.submit-link{display:none;border:0;border-radius:999px;background:var(--blue);color:#fff;padding:10px 16px;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none}.submit-link:not([hidden]){display:inline-block}.series-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;padding:46px 0 60px}.series-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);animation:reveal .42s ease both}.series-card>img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--line)}.series-info{padding:15px}.series-date{margin:0;color:var(--muted);font-size:13px}.series-card h2{margin:8px 0;font-size:clamp(24px,3vw,35px);line-height:1.05;letter-spacing:-.05em}.series-preview{display:-webkit-box;margin:0;overflow:hidden;color:var(--muted);font-size:16px;line-height:1.55;-webkit-box-orient:vertical;-webkit-line-clamp:3}.series-empty{grid-column:1/-1;margin:0;padding:42px 0;color:var(--muted);font-size:20px;text-align:center}@keyframes reveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}footer{padding:30px 0 42px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}@media(max-width:560px){.wrap{width:min(100% - 28px,1060px)}header{padding-bottom:50px}.series-grid{grid-template-columns:1fr;gap:12px;padding-top:32px}}</style></head><body><header class="wrap"><nav><a href="./index.html">← 首頁</a><span><a class="submit-link" href="./upload-series.html" data-admin-only hidden>投稿</a>&nbsp;&nbsp;<button class="admin-trigger" data-admin-login type="button">管理登入</button></span></nav><h1>火熱連載中🔥</h1><p class="subtitle">還在發生，還沒有結尾。</p></header><main class="wrap"><section class="series-grid" id="series-grid" aria-label="連載內容"></section></main><footer class="wrap">© 甲魚 · 春花秋月何時了</footer><script type="module" src="./js/hot-series.js"></script></body></html>
