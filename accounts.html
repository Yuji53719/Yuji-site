<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帳號管理 · 甲魚</title><style>:root{color-scheme:light dark;--bg:#fbfcff;--surface:#fff;--ink:#14294a;--muted:#5e6f87;--line:#dbe4f0;--blue:#245fa8;--red:#bd3446;--shadow:0 14px 36px rgb(25 71 132 / .10)}@media(prefers-color-scheme:dark){:root{--bg:#1b2028;--surface:#242b35;--ink:#eff5ff;--muted:#b1bfd1;--line:#3b4655;--blue:#85b9f6;--red:#ff8d98;--shadow:0 14px 36px rgb(0 0 0 / .25)}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:PMingLiU,"新細明體",serif}.wrap{width:min(850px,calc(100% - 40px));margin:auto}header{padding:28px 0 56px;border-bottom:1px solid var(--line)}a{color:var(--blue);font-weight:bold}h1{margin:72px 0 0;font-size:clamp(55px,10vw,105px);letter-spacing:-.09em;line-height:.8}.subtitle{margin:24px 0 0;color:var(--muted);font-size:19px}.panel{margin:38px 0;border:1px solid var(--line);border-radius:22px;background:var(--surface);padding:25px;box-shadow:var(--shadow)}.panel h2{margin:0 0 20px;font-size:28px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form label{display:grid;gap:7px;font-weight:bold}.form label:last-of-type{grid-column:1/-1}.form input{border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);padding:11px;font:inherit}.form button,.row button{border:0;border-radius:12px;background:var(--blue);color:#fff;padding:10px 15px;font:inherit;font-weight:bold;cursor:pointer}.form button{justify-self:start}.message{min-height:1.3em;color:var(--muted)}.accounts{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row p{margin:0}.row small{display:block;margin-top:5px;color:var(--muted)}.row-actions{display:flex;gap:7px}.row .danger{background:var(--red)}@media(max-width:560px){.wrap{width:min(100% - 28px,850px)}.form{grid-template-columns:1fr}.form label:last-of-type{grid-column:auto}.row{align-items:flex-start;flex-direction:column}}</style></head><body><header class="wrap"><a href="./index.html">← 首頁</a><h1>帳號</h1><p class="subtitle">把鑰匙交給值得信任的人。</p></header><main class="wrap"><section class="panel"><h2>新增投稿者</h2><form class="form" id="account-form"><label>帳號<input id="account-username" required pattern="[A-Za-z0-9_-]{3,40}" placeholder="例如 lin"></label><label>顯示名稱<input id="account-name" required placeholder="例如 林"></label><label>初始密碼<input id="account-password" type="password" required minlength="8"></label><p class="message" id="account-message"></p><button type="submit">建立帳號</button></form></section><section class="panel"><h2>現有帳號</h2><div class="accounts" id="account-list"></div></section></main><script type="module" src="./js/accounts.js"></script></body></html>
