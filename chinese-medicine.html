<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="甲魚整理的中藥學習資料與藥材關係筆記">
  <title>中藥 · 甲魚</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7faff;--surface:#fff;--surface-soft:#edf4ff;--ink:#10284d;--muted:#60738e;--line:#d5e1f1;--blue:#2465b5;--blue-deep:#123d78;--blue-soft:#dceaff;--red:#b93c4b;--shadow:0 20px 60px rgb(25 61 111/.11)}
    @media(prefers-color-scheme:dark){:root{--bg:#191f27;--surface:#232b36;--surface-soft:#29384b;--ink:#eef5ff;--muted:#afbdd0;--line:#3b485a;--blue:#8cbfff;--blue-deep:#b6d5ff;--blue-soft:#263e5d;--red:#ff8793;--shadow:0 24px 70px rgb(0 0 0/.3)}}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:STSong,"Songti SC","SimSun",serif}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}button,input,textarea,select{font:inherit}button{color:inherit}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:28px}.top-actions{display:flex;align-items:center;gap:20px}.text-link{border:0;background:transparent;color:var(--blue);font-weight:bold;text-decoration:underline;text-underline-offset:5px;cursor:pointer;padding:0}.hero{padding:0 0 72px;border-bottom:1px solid var(--line)}.hero h1{margin:84px 0 0;font-size:clamp(72px,13vw,158px);letter-spacing:-.11em;line-height:.82}.subtitle{margin:30px 0 0;color:var(--blue);font-size:clamp(19px,2.5vw,28px);line-height:1.5}.disclaimer{max-width:720px;margin:22px 0 0;color:var(--muted);font-size:14px;line-height:1.7}.primary{border:0;border-radius:999px;background:var(--blue);color:#fff;padding:12px 21px;font-weight:bold;cursor:pointer;box-shadow:0 10px 24px rgb(36 101 181/.22);transition:transform .2s ease,box-shadow .2s ease}.primary:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgb(36 101 181/.28)}main{min-height:56vh;padding:72px 0 95px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px}.eyebrow{margin:0 0 12px;color:var(--blue);font-size:13px;font-weight:bold;letter-spacing:.14em}.section-head h2{margin:0;font-size:clamp(36px,5vw,62px);letter-spacing:-.07em}.section-note{max-width:390px;margin:0;color:var(--muted);font-size:16px;line-height:1.65}.medicine-field{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px;min-height:370px;margin-top:40px;padding:clamp(25px,5vw,58px);border:1px solid var(--line);border-radius:36px;background:radial-gradient(circle at 50% 45%,var(--surface) 0,var(--surface-soft) 72%,transparent 73%),var(--surface);box-shadow:var(--shadow);overflow:hidden}.medicine-field::before,.medicine-field::after{content:"";position:absolute;width:250px;height:250px;border:1px solid var(--line);border-radius:50%;opacity:.55}.medicine-field::before{left:-120px;top:-130px}.medicine-field::after{right:-110px;bottom:-140px}.medicine-node{position:relative;z-index:1;min-height:82px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--blue-deep);font-size:clamp(18px,2vw,25px);font-weight:bold;letter-spacing:.06em;cursor:pointer;box-shadow:0 10px 24px rgb(23 65 120/.08);transition:transform .24s ease,border-color .24s ease,background .24s ease}.medicine-node:nth-child(3n+2){transform:translateY(18px)}.medicine-node:nth-child(4n){transform:translateY(-10px)}.medicine-node:hover,.medicine-node:focus-visible{transform:translateY(-6px) scale(1.04);border-color:var(--blue);background:var(--blue-soft);outline:none}.empty,.loading{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted);font-size:19px}dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}dialog::backdrop{background:rgb(7 17 34/.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.detail-dialog{width:min(960px,calc(100% - 26px));max-height:calc(100vh - 32px);padding:0;border-radius:30px}.dialog-shell{position:relative;padding:clamp(25px,5vw,48px);overflow:auto}.icon-close{position:absolute;top:18px;right:20px;width:40px;height:40px;border:0;border-radius:50%;background:var(--surface-soft);font-size:25px;cursor:pointer}.detail-top{display:grid;grid-template-columns:minmax(220px,360px) 1fr;gap:clamp(26px,5vw,54px);align-items:start}.medicine-image{width:100%;aspect-ratio:4/3;border-radius:24px;object-fit:cover;background:linear-gradient(135deg,var(--blue-soft),var(--surface-soft));border:1px solid var(--line)}.image-placeholder{display:grid;place-items:center;color:var(--muted);font-size:18px}.detail-copy h2{margin:15px 0 20px;font-size:clamp(45px,8vw,82px);letter-spacing:-.08em;line-height:.9}.traits{display:flex;flex-wrap:wrap;gap:10px}.trait{padding:8px 13px;border-radius:999px;background:var(--blue-soft);color:var(--blue-deep);font-weight:bold}.notes{margin:24px 0 0;color:var(--muted);font-size:18px;line-height:1.85;white-space:pre-wrap}.admin-actions{display:flex;gap:12px;margin-top:25px}.secondary,.danger{border:1px solid var(--line);border-radius:999px;background:transparent;padding:9px 16px;font-weight:bold;cursor:pointer}.danger{border-color:var(--red);color:var(--red)}.relations-title{margin:48px 0 10px;font-size:27px}.relationship-graph{position:relative;min-height:400px;margin-top:18px;border:1px solid var(--line);border-radius:28px;background:radial-gradient(circle,var(--surface-soft) 0 2px,transparent 3px) 0 0/25px 25px;overflow:hidden}.graph-center{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%);display:grid;place-items:center;width:118px;height:118px;border-radius:50%;background:var(--blue-deep);color:var(--surface);font-size:24px;font-weight:bold;box-shadow:0 0 0 15px rgb(36 101 181/.14)}.relation-ray{position:absolute;left:50%;top:50%;width:var(--distance);height:2px;transform-origin:0 50%;transform:rotate(var(--angle));background:var(--ray);opacity:.55}.relation-node{position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%) rotate(var(--angle)) translateX(var(--distance)) rotate(calc(-1 * var(--angle)));width:96px;min-height:58px;border:1px solid var(--ray);border-radius:999px;background:var(--surface);font-weight:bold;cursor:pointer;padding:8px;box-shadow:0 8px 20px rgb(24 52 92/.12)}.relation-node:hover{background:var(--surface-soft)}.relation-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:18px}.relation-group{padding:18px;border:1px solid var(--line);border-radius:20px}.relation-group h4{margin:0 0 10px;color:var(--group-color);font-size:17px}.relation-group p{margin:7px 0;color:var(--muted);line-height:1.5}.relation-group button{border:0;background:transparent;color:var(--ink);font-weight:bold;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:4px}.no-relations{padding:50px 20px;text-align:center;color:var(--muted)}.edit-dialog{width:min(700px,calc(100% - 26px));max-height:calc(100vh - 28px);padding:0;border-radius:28px}.editor-form{position:relative;display:grid;gap:18px;padding:clamp(25px,5vw,42px);overflow:auto}.editor-form h2{margin:0;font-size:40px;letter-spacing:-.06em}.editor-form label{display:grid;gap:8px;font-weight:bold}.editor-form input,.editor-form textarea,.editor-form select{width:100%;border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--ink);padding:13px}.editor-form textarea{min-height:130px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.image-preview{display:none;width:150px;aspect-ratio:4/3;border-radius:16px;object-fit:cover;border:1px solid var(--line)}.image-preview.visible{display:block}.relation-editor{display:grid;gap:10px;padding:18px;border:1px solid var(--line);border-radius:20px}.relation-editor-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.relation-editor h3{margin:0}.add-relation{border:0;background:transparent;color:var(--blue);font-weight:bold;cursor:pointer}.relation-row{display:grid;grid-template-columns:1.1fr .9fr 1.5fr auto;gap:8px;align-items:center}.remove-relation{width:34px;height:34px;border:0;border-radius:50%;background:rgb(185 60 75/.13);color:var(--red);font-size:20px;cursor:pointer}.form-error{min-height:1.3em;margin:0;color:var(--red)}.form-actions{display:flex;justify-content:flex-end;gap:12px}.cancel{border:0;background:transparent;color:var(--muted);font-weight:bold;cursor:pointer;padding:12px 18px}footer{padding:28px 0 42px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
    @media(max-width:720px){.wrap{width:min(100% - 28px,1120px)}.topbar{align-items:flex-start}.top-actions{gap:12px}.hero h1{margin-top:66px}.section-head{display:block}.section-note{margin-top:18px}.medicine-field{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-radius:25px;padding:24px 16px}.medicine-node{min-height:72px}.detail-top{grid-template-columns:1fr}.medicine-image{max-height:330px}.relationship-graph{min-height:330px}.graph-center{width:92px;height:92px;font-size:20px}.relation-node{width:80px;min-height:50px;font-size:14px}.relation-groups{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.relation-row{grid-template-columns:1fr 1fr auto}.relation-row input{grid-column:1/-1}.remove-relation{grid-column:3;grid-row:1}.dialog-shell{padding-top:58px}}
    @media(max-width:430px){.top-actions .primary{padding:10px 14px}.relationship-graph{min-height:300px}.relation-node{width:72px;font-size:13px}.graph-center{width:80px;height:80px}.relation-row{grid-template-columns:1fr auto}.relation-row select:nth-child(2){grid-column:1/-1}.remove-relation{grid-column:2;grid-row:1}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><nav class="topbar"><a class="text-link" href="./index.html">← 首頁</a><div class="top-actions"><button class="text-link" type="button" data-admin-login>管理員登入</button><button class="primary" id="add-medicine" type="button" data-admin-only hidden>新增藥材</button></div></nav><h1>中藥</h1><p class="subtitle">多識於鳥獸草木之名。</p><p class="disclaimer">本頁是個人學習筆記。配伍、禁忌與性味關係均由管理員自行整理，不構成診療或用藥建議；實際使用請諮詢合格中醫師或藥師。</p></div></header>
  <main><div class="wrap"><div class="section-head"><div><p class="eyebrow">MATERIA MEDICA</p><h2>藥名如星火散開</h2></div><p class="section-note">畫面僅展示藥名。點擊任一味藥材，查看性味、圖片、備註與你整理的聯用關係。</p></div><section class="medicine-field" id="medicine-field" aria-live="polite"><p class="loading">正在翻開藥簿……</p></section></div></main>
  <footer><div class="wrap">© 甲魚 · 到底是香是臭 · 本頁內容僅供個人學習整理</div></footer>
  <dialog class="detail-dialog" id="medicine-detail"><div class="dialog-shell"><button class="icon-close" id="detail-close" type="button" aria-label="關閉">×</button><div id="detail-content"></div></div></dialog>
  <dialog class="edit-dialog" id="medicine-editor"><form class="editor-form" id="medicine-form"><button class="icon-close" id="editor-close" type="button" aria-label="關閉">×</button><p class="eyebrow">ADMIN EDITOR</p><h2 id="editor-title">新增藥材</h2><input id="medicine-id" type="hidden"><label>藥材名稱<input id="medicine-name" maxlength="80" required></label><div class="form-grid"><label>性<input id="medicine-nature" maxlength="80" placeholder="例如：寒、涼、平、溫、熱"></label><label>味<input id="medicine-flavor" maxlength="120" placeholder="例如：辛、甘、酸、苦、鹹"></label></div><label>藥材圖片（可留空）<input id="medicine-image" type="file" accept="image/*"><img class="image-preview" id="medicine-image-preview" alt="所選藥材圖片預覽"></label><label>我的備註<textarea id="medicine-notes" maxlength="5000" placeholder="寫下來源、辨識重點或自己的學習筆記……"></textarea></label><section class="relation-editor"><div class="relation-editor-head"><div><h3>藥材關係</h3><small>以下內容完全由你自行整理</small></div><button class="add-relation" id="add-relation" type="button">＋ 新增關係</button></div><div id="relation-rows"></div></section><p class="form-error" id="medicine-error" role="alert"></p><div class="form-actions"><button class="cancel" id="editor-cancel" type="button">取消</button><button class="primary" id="medicine-save" type="submit">保存</button></div></form></dialog>
  <script type="module" src="./js/chinese-medicine.js"></script>
</body>
</html>
